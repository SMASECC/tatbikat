---
- name: Check the supported Ubuntu base
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == 'Ubuntu'
      - ansible_facts.distribution_version is version('24.04', '>=')
    fail_msg: "Bu temel rol Ubuntu Server 24.04 ve üzeri için hazırlanmıştır."
- name: Install the base service packages
  ansible.builtin.apt:
    name:
      - python3
      - python3-venv
      - ca-certificates
      - qemu-guest-agent
      - auditd
      - chrony
      - logrotate
    state: present
    update_cache: true
    cache_valid_time: 3600
- name: Enable audit and clock services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - auditd
    - chrony
