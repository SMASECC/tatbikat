---
- name: Read Proxmox deployment prerequisites without changing the host
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../site.example.yml
  vars:
    pve_api_token_id: "{{ lookup('ansible.builtin.env', 'PROXMOX_API_TOKEN_ID') }}"
    pve_api_token_secret: "{{ lookup('ansible.builtin.env', 'PROXMOX_API_TOKEN_SECRET') }}"
  tasks:
    - name: Require the actual deployment settings
      ansible.builtin.assert:
        that:
          - deployment_configured | bool
          - pve_node is match('^[A-Za-z0-9][A-Za-z0-9_-]+$')
          - "'REPLACE_ME' not in pve_node"
          - "'REPLACE_ME' not in pve_storage"
          - "'REPLACE_ME' not in pve_ca_path"
          - pve_api_token_id | length > 5
          - "'REPLACE_ME' not in pve_api_token_id"
          - pve_api_token_secret | length > 10
        fail_msg: "Gerçek Proxmox node, storage, CA ve token bilgilerini yerel ayarlarda tamamlayın."
      no_log: true
    - name: Require a trusted Proxmox CA file
      ansible.builtin.stat:
        path: "{{ pve_ca_path }}"
      register: pve_ca
    - name: Check CA path
      ansible.builtin.assert:
        that:
          - pve_ca.stat.isreg | default(false)
        fail_msg: "Proxmox CA dosyası kontrol makinesinde bulunmalıdır."
    - name: Read the authenticated Proxmox version
      ansible.builtin.uri:
        url: "https://{{ pve_host }}:8006/api2/json/version"
        method: GET
        headers:
          Authorization: "PVEAPIToken={{ pve_api_token_id }}={{ pve_api_token_secret }}"
        validate_certs: true
        ca_path: "{{ pve_ca_path }}"
        return_content: true
        status_code: 200
      no_log: true
      register: pve_version
      check_mode: false
    - name: Read host network interfaces
      ansible.builtin.uri:
        url: "https://{{ pve_host }}:8006/api2/json/nodes/{{ pve_node }}/network"
        method: GET
        headers:
          Authorization: "PVEAPIToken={{ pve_api_token_id }}={{ pve_api_token_secret }}"
        validate_certs: true
        ca_path: "{{ pve_ca_path }}"
        return_content: true
        status_code: 200
      no_log: true
      register: pve_networks
      check_mode: false
    - name: Verify the selected bridges exist
      ansible.builtin.assert:
        that:
          - item.value in (pve_networks.json.data | map(attribute='iface') | list)
        fail_msg: "Önerilen bridge hostta bulunmamaktadır; gerçek bridge eşlemesini tamamlayın."
      loop: "{{ proxmox_bridges | dict2items }}"
    - name: Report the completed read-only preflight
      ansible.builtin.debug:
        msg: "Proxmox {{ pve_version.json.data.version }} erişimi ve bridge adları doğrulandı. VM veya ağ değişikliği yapılmadı."
